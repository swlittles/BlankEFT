<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://assets.tarkov.dev https://static.wikia.nocookie.net; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Tarkov Quest Map</title>
    <link rel="stylesheet" href="../../node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-view="map">
    <header id="topbar">
      <div class="brand">TARKOV<span>QUEST MAP</span></div>
      <div class="seg views" id="view-seg">
        <button data-view="map" class="active">Map</button>
        <button data-view="ammo">Ammo</button>
        <button data-view="guns">Gunsmith</button>
      </div>
      <div class="status-pill map-only" id="raid-status" title="Detected from the game's log files">Waiting for logs…</div>
      <label class="ctl" title="Which game mode's quest progress is shown. Each mode tracks its own progress.">Mode
        <select id="mode-select"></select>
      </label>
      <span class="status-pill prestige" id="prestige-pill" title="Prestige level for this mode (change it in Settings)"></span>
      <button class="status-pill warn" id="mode-warn" hidden></button>
      <div class="tb-right">
      <button id="update-btn" class="update-btn" hidden></button>
      <button class="toggle" id="pin-toggle" title="Keep this window on top of the game">Pin</button>
      </div>
    </header>

    <div id="body">
      <aside id="filters" class="map-only" aria-label="Map filters">
        <div class="fp-head">Map filters</div>
        <div class="fp-body">
          <section class="fp-sec">
            <label class="fp-field">Map<select id="map-select"></select></label>
            <label class="fp-field" id="floor-ctl" hidden>Floor<select id="floor-select"></select></label>
          </section>
          <section class="fp-sec">
            <h4>Quest markers</h4>
            <div class="fp-list" id="filter-seg">
              <button data-filter="active"><b>Active</b><span>Quests you've started</span></button>
              <button data-filter="available"><b>+ Available</b><span>Plus ones you can pick up</span></button>
              <button data-filter="all"><b>All</b><span>Every quest on this map</span></button>
              <button data-filter="plan" title="Only the quests in your raid plan, with the route"><b>Plan</b><span>Your raid plan and route</span></button>
            </div>
          </section>
          <section class="fp-sec">
            <h4>Layers</h4>
            <button class="toggle fp-row" id="extracts-toggle" title="Show extracts"><i>🚪</i>Extracts</button>
            <div id="extract-legend" class="fp-legend" hidden>
              <label><input type="checkbox" data-faction="pmc"> <span class="lg-dot faction-pmc"></span>PMC</label>
              <label><input type="checkbox" data-faction="scav"> <span class="lg-dot faction-scav"></span>Scav</label>
              <label><input type="checkbox" data-faction="shared"> <span class="lg-dot faction-shared"></span>Both</label>
              <div class="legend-kinds" title="Special extract types">🗝️ Secret · 🎆 Flare · 🤝 Co-op<br>🚗 V-Ex · 🚂 Train · 🧗 Cliff · 🛗 Elevator</div>
            </div>
            <button class="toggle fp-row" id="spawns-toggle" title="Show PMC spawn points"><i>📍</i>Spawns</button>
            <button class="toggle fp-row" id="locks-toggle" title="Show locked rooms and car trunks, and which key opens each"><i>🔑</i>Keys</button>
            <button class="toggle fp-row" id="bosses-toggle" title="Show boss spawn spots. Hover one to see which bosses can spawn there"><i>💀</i>Bosses</button>
            <button class="toggle fp-row" id="loot-toggle" title="Show loot containers: weapon boxes, ammo boxes, bodies, safes and more"><i>📦</i>Loot</button>
            <div id="loot-legend" class="fp-legend" hidden></div>
          </section>
        </div>
      </aside>
      <div id="map-wrap">
        <div id="map"></div>
        <div id="map-empty" hidden></div>
        <div id="position-chip" hidden></div>
        <button id="filters-toggle" class="map-only" title="Hide map filters">‹</button>
        <button id="sidebar-toggle" title="Hide the sidebar">›</button>
      </div>
      <aside id="sidebar">
        <nav class="tabs">
          <button data-tab="here" class="active">This map</button>
          <button data-tab="plan">Raid plan</button>
          <button data-tab="quests">All quests</button>
          <button data-tab="settings">Settings</button>
        </nav>
        <section class="tab" id="tab-here">
          <div class="quest-tools here-tools">
            <input id="here-search" type="search" placeholder="Search every quest on this map…" title="Searches quest names, traders and objectives on this map, whatever their status. Esc clears it." />
          </div>
          <div id="here-list"></div>
        </section>
        <section class="tab" id="tab-plan" hidden></section>
        <section class="tab" id="tab-quests" hidden>
          <div class="quest-tools">
            <input id="quest-search" type="search" placeholder="Search quests or traders…" />
            <select id="quest-status-filter">
              <option value="">All statuses</option>
              <option value="started">Active</option>
              <option value="available">Available</option>
              <option value="completed">Completed</option>
              <option value="locked">Locked</option>
              <option value="failed">Failed</option>
            </select>
            <select id="quest-unlock-filter" title="Quests that unlock items at traders">
              <option value="">Any unlocks</option>
              <option value="direct">🔓 Unlocks items</option>
              <option value="later">⤳ Leads to unlocks</option>
              <option value="either">Either</option>
            </select>
            <select id="quest-sort" title="Sort order">
              <option value="recent">Newest completed first</option>
              <option value="oldest">Oldest completed first</option>
              <option value="trader">Trader &amp; level</option>
              <option value="name">Name</option>
            </select>
          </div>
          <div id="quest-counts" class="muted small"></div>
          <div id="quest-list"></div>
        </section>
        <section class="tab" id="tab-settings" hidden></section>
      </aside>
    </div>
    <div id="view-ammo" class="view" hidden></div>
    <div id="view-guns" class="view" hidden></div>
    <div id="modal" hidden></div>
    <div id="toasts"></div>

    <script src="../../node_modules/leaflet/dist/leaflet.js"></script>
    <script src="planner.js"></script>
    <script src="loot.js"></script>
    <script src="bosses.js"></script>
    <script src="armory.js"></script>
    <script src="armoryViews.js"></script>
    <script src="mapView.js"></script>
    <script src="questDetails.js"></script>
    <script src="app.js"></script>
    <script src="updates.js"></script>
  </body>
</html>
