# Builds the Windows installer and publishes it to GitHub Releases when a version tag is pushed.
# The installed app checks this Releases page and updates itself (see src/main/updater.js).
# Cut a release with: npm run release
#
# The release is created as a draft first and electron-builder uploads into it. Letting
# electron-builder create it can race and leave two releases with the same tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $v"; exit 1; }

      - run: npm ci
      - run: npm test

      - name: Create the release as a draft, with notes from the commits since the last one
        shell: bash
        run: |
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          {
            echo "## What's new"
            git log "$range" --no-merges --format='- %s' | grep -v '^- Release v' || true
            echo
            echo "**New install:** download \`BlankEFT-Setup-${GITHUB_REF_NAME#v}.exe\` below and run it. Windows may say \"Windows protected your PC\": click More info, then Run anyway."
            echo
            echo "**Already installed:** the app updates itself. It downloads new versions in the background and installs them when you restart it."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "BlankEFT $GITHUB_REF_NAME" --notes-file notes.md

      - name: Build the installer and upload it to the draft
        run: npx electron-builder --win --publish always

      - name: Publish the release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
